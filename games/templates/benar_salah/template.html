<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>__GAME_TITLE__</title>
<style>
body{margin:0;font-family:system-ui,"Segoe UI",Roboto,sans-serif;background:#22303f;min-height:100vh;color:#fff;display:flex;flex-direction:column}
.wrap{flex:1;max-width:820px;width:100%;margin:0 auto;padding:14px;box-sizing:border-box;display:flex;flex-direction:column}
.bar{display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:1.05rem}
.streak{background:#f4b52c;color:#3b2a00;border-radius:999px;padding:3px 12px;font-size:.9rem;visibility:hidden}
.waktu{height:10px;background:rgba(255,255,255,.15);border-radius:9px;overflow:hidden;margin:12px 0}
.waktu>div{height:100%;width:100%;background:#4fd1a1;transform-origin:left}
.kartu{flex:1;min-height:200px;background:#fff;color:#1c2436;border-radius:24px;display:flex;align-items:center;justify-content:center;
  padding:28px;text-align:center;font-size:clamp(1.3rem,4vw,2.1rem);font-weight:800;line-height:1.35;white-space:pre-wrap;
  box-shadow:0 10px 0 rgba(0,0,0,.25);transition:transform .25s,background .25s}
.kartu.benar{background:#dff7ea}.kartu.salah{background:#fde2e2}
.kartu.masuk{animation:masuk .35s ease-out}
@keyframes masuk{from{transform:translateY(20px) rotate(-1.5deg);opacity:0}to{transform:none;opacity:1}}
.catatan{min-height:1.6em;text-align:center;font-weight:700;margin:12px 0 4px}
.tombol{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:8px}
.tombol button{border:0;border-radius:20px;padding:22px 10px;font-size:clamp(1.3rem,4vw,1.8rem);font-weight:900;color:#fff;cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:12px}
.tombol .b{background:#1f9d6b;box-shadow:0 7px 0 #136b48}.tombol .s{background:#d64545;box-shadow:0 7px 0 #962c2c}
.tombol button:active:not(:disabled){transform:translateY(5px);box-shadow:0 2px 0 rgba(0,0,0,.3)}
.tombol button:disabled{opacity:.5;cursor:default}
.tombol small{display:block;font-size:.8rem;opacity:.8;font-weight:600}
.hint{text-align:center;font-size:.85rem;opacity:.65;margin-top:12px}
@media (prefers-reduced-motion:reduce){.kartu.masuk{animation:none}}
</style></head><body>
<div id="gk-header"></div>
<div class="wrap">
  <div class="bar"><span id="no"></span><span class="streak" id="streak"></span><span id="sk"></span></div>
  <div class="waktu" id="waktu"><div id="waktu-isi"></div></div>
  <div class="kartu" id="kartu">Bersiap…</div>
  <div class="catatan" id="catatan"></div>
  <div class="tombol">
    <button class="b" id="tb" data-j="0">✔ <span id="lb0">Benar</span></button>
    <button class="s" id="ts" data-j="1">✘ <span id="lb1">Salah</span></button>
  </div>
  <p class="hint">Keyboard: tekan B untuk benar, S untuk salah</p>
</div>
<script>window.GAME_DATA = /*__GAME_DATA__*/;</script>
<script src="../../../assets/js/game-common.js"></script>
<script>
(function () {
  var D = GK.data, P = D.pengaturan || {}, soal = [], idx = 0, skor = 0, beruntun = 0, nama = '', t0 = 0;
  var batas = +P.waktu_soal || 0, mulaiSoal = 0, raf = null, kunci = true;
  function $(id) { return document.getElementById(id); }
  if (D.soal[0] && D.soal[0].o) { $('lb0').textContent = D.soal[0].o[0]; $('lb1').textContent = D.soal[0].o[1]; }
  if (!batas) $('waktu').style.visibility = 'hidden';

  function mulai(n) { nama = n; soal = P.acak_soal ? GK.shuffle(D.soal) : D.soal.slice(); idx = 0; skor = 0; beruntun = 0; t0 = Date.now(); tampil(); }
  function tampil() {
    if (idx >= soal.length) return selesai();
    var k = $('kartu');
    k.className = 'kartu'; void k.offsetWidth; k.className = 'kartu masuk';
    k.textContent = soal[idx].q;
    $('catatan').textContent = '';
    $('no').textContent = (idx + 1) + ' / ' + soal.length;
    $('sk').textContent = '⭐ ' + skor;
    $('tb').disabled = $('ts').disabled = false;
    kunci = false;
    if (batas) { mulaiSoal = performance.now(); cancelAnimationFrame(raf); raf = requestAnimationFrame(detik); }
  }
  function detik(now) {
    if (kunci) return;
    var sisa = 1 - (now - mulaiSoal) / (batas * 1000);
    var bar = $('waktu-isi');
    bar.style.transform = 'scaleX(' + Math.max(0, sisa) + ')';
    bar.style.background = sisa < .3 ? '#ff7a7a' : sisa < .6 ? '#f4b52c' : '#4fd1a1';
    if (sisa <= 0) jawab(-1); else raf = requestAnimationFrame(detik);
  }
  function jawab(j) {
    if (kunci) return;
    kunci = true; cancelAnimationFrame(raf);
    $('tb').disabled = $('ts').disabled = true;
    var s = soal[idx], ok = j === s.b, k = $('kartu');
    if (ok) {
      skor++; beruntun++; GK.sfxBenar(); k.classList.add('benar');
      $('catatan').textContent = beruntun >= 3 ? 'Tepat! ' + beruntun + ' kali berturut-turut 🔥' : 'Tepat! 🎉';
    } else {
      beruntun = 0; GK.sfxSalah(); k.classList.add('salah');
      $('catatan').textContent = (j < 0 ? 'Waktu habis. ' : 'Kurang tepat. ') + (P.tampil_jawaban ? 'Jawabannya: ' + s.o[s.b] : '');
    }
    $('streak').style.visibility = beruntun >= 3 ? 'visible' : 'hidden';
    $('streak').textContent = '🔥 ' + beruntun;
    $('sk').textContent = '⭐ ' + skor;
    setTimeout(function () { idx++; tampil(); }, ok ? 900 : 1700);
  }
  function selesai() {
    kunci = true;
    GK.result({ nama: nama, skor: skor, maks: soal.length, durasi: Math.round((Date.now() - t0) / 1000), onReplay: function () { mulai(nama); } });
  }
  $('tb').onclick = function () { jawab(0); };
  $('ts').onclick = function () { jawab(1); };
  document.addEventListener('keydown', function (e) {
    if (document.querySelector('.gk-ov')) return;
    var k = e.key.toLowerCase();
    if (k === 'b' || k === 'arrowleft') jawab(0);
    if (k === 's' || k === 'arrowright') jawab(1);
  });
  GK.start({ needName: true, onStart: mulai });
})();
</script>
</body></html>
